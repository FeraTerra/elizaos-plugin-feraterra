name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @feraterra/plugin-elizaos via npm OIDC Trusted Publisher
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Upgrade npm CLI for OIDC Trusted Publishing
        run: npm install -g npm@latest

      - name: Run deterministic plugin tests before publishing
        run: node --test test/plugin.test.mjs

      - name: Check npm registry bootstrap readiness
        id: npm_check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/@feraterra%2fplugin-elizaos")
          echo "http_status=${STATUS}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${STATUS}" = "200" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::@feraterra/plugin-elizaos is not yet initialized on registry.npmjs.org (HTTP ${STATUS}). Bootstrap the package and bind Trusted Publisher (FeraTerra/elizaos-plugin-feraterra, publish-npm.yml) on npmjs.com, then trigger workflow_dispatch or publish the next release."
          fi

      - name: Publish to npm with provenance
        if: steps.npm_check.outputs.ready == 'true'
        run: npm publish --access public --provenance
